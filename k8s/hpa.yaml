apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auto-repara-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auto-repara-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 5
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 5
