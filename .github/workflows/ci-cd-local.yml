name: CI/CD Local

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [ 'feature/**', 'develop', 'main' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        working-directory: app
        run: dotnet restore GestaoAutoRepara.slnx

      - name: Build da solução
        working-directory: app
        run: dotnet build GestaoAutoRepara.slnx --no-restore --configuration Release

      - name: Executar testes
        working-directory: app
        run: dotnet test GestaoAutoRepara.slnx --no-build --configuration Release --verbosity minimal

  deploy-k8s-local:
    needs: build-and-test
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        working-directory: app
        run: docker build -t autorepara-api:local .

      - name: Usar o contexto padrão do cluster
        run: |
          kubectl config current-context
          kubectl cluster-info

      - name: Aplicar manifests no cluster padrão
        run: |
          kubectl apply -f k8s/volume.yaml
          kubectl apply -f k8s/persistClaim.yaml
          kubectl apply -f k8s/deployment-sql.yaml
          kubectl apply -f k8s/service-sql.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/environment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/metrics.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar deploy do cluster
        run: |
          kubectl rollout status deployment/mysql --timeout=300s
          kubectl rollout status deployment/auto-repara-deployment --timeout=300s
