name: CI/CD Local

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [ 'feature/**', 'develop', 'main' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        working-directory: src
        run: dotnet restore GestaoAutoRepara.slnx

      - name: Build da solução
        working-directory: src
        run: dotnet build GestaoAutoRepara.slnx --no-restore --configuration Release

      - name: Executar testes
        working-directory: src
        run: dotnet test GestaoAutoRepara.slnx --no-build --configuration Release --verbosity minimal

  publish-dockerhub:
    needs: build-and-test
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DOCKERHUB_IMAGE: maquese/techchallenge-3
      DOCKERHUB_TAG: v1

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagem local e tag do Docker Hub
        working-directory: src
        run: |
          docker build \
            -t ecs-image-api:latest \
            -t ${DOCKERHUB_IMAGE}:${DOCKERHUB_TAG} .

      - name: Publicar imagem no Docker Hub
        run: docker push ${DOCKERHUB_IMAGE}:${DOCKERHUB_TAG}
