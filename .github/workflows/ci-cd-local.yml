name: CI/CD Local

permissions:
  contents: read

on:
  push:
    branches:
      - 'feature/**'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        working-directory: src
        run: dotnet restore GestaoAutoRepara.slnx

      - name: Build da solução
        working-directory: src
        run: dotnet build GestaoAutoRepara.slnx --no-restore --configuration Release

      - name: Executar testes
        working-directory: src
        run: dotnet test GestaoAutoRepara.slnx --no-build --configuration Release --verbosity minimal

  create-pr-to-main:
    name: Open PR to main
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar PR para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr list --base main --head "${GITHUB_REF_NAME}" --state open --json url --jq '.[0].url // empty')

          if [ -z "$PR_URL" ]; then
            gh pr create \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "feat: ${GITHUB_REF_NAME}" \
              --body "## Resumo
              - Build e testes executados na branch de feature
              - PR pronta para revisão e merge em main"
          else
            echo "PR já existente para ${GITHUB_REF_NAME}: $PR_URL"
          fi

  publish-dockerhub:
    name: Publish Docker image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]

    env:
      DOCKERHUB_IMAGE: maquese/techchallenge-3
      DOCKERHUB_TAG: ${{ github.sha }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build da imagem local
        working-directory: src
        run: |
          docker build \
            -t techchallenge-api:local \
            -t ${DOCKERHUB_IMAGE}:latest \
            -t ${DOCKERHUB_IMAGE}:${DOCKERHUB_TAG} .

      - name: Push para Docker Hub
        run: |
          docker push ${DOCKERHUB_IMAGE}:latest
          docker push ${DOCKERHUB_IMAGE}:${DOCKERHUB_TAG}
