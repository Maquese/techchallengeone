apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-repara-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-repara-api
  template:
    metadata:
      labels:
        app: auto-repara-api
    spec:
      containers:
        - name: auto-repara-api
          image: auto:latest
          envFrom:
            - configMapRef:
                name: appsettings-config
          volumeMounts:
            - name: config-volume
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
      volumes:
        - name: mysql-pv-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: config-volume
          configMap:
            name: appsettings-config
